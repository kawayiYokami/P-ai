[package]
name = "easy-call-ai"
version = "0.98.12"
edition = "2021"
description = "P-ai desktop app"
default-run = "p-ai"
autobins = false

[[bin]]
name = "p-ai"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
chardetng = "=1.0.0"
encoding_rs = "=0.8.44"
toml = "=1.2.2"
directories = "=6.0.0"
tauri = { version = "=2.12.7", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-notification = "=2.8.1"
# 2.6.0 起要求 tauri ^2.12；tauri 已升到 2.12 线，原先阻止它升级的
# webview2-com 版本冲突（见下方 pin 注释）已随 webview2-com 0.39 一并解决。
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-clipboard-manager = "=2.5.0"
# 日志写入层交给 tauri-plugin-log；CLI（headless / ACP）没有 Tauri app，
# 复用插件 re-export 的 fern 自己装 logger，date-based 让 CLI 日志按天分文件。
fern = { version = "=0.7.1", features = ["date-based"] }
log = "=0.4.35"
tauri-plugin-log = "=2.10.2"
time = { version = "=0.3.55", features = ["local-offset"] }
rmcp = { version = "=3.11.0", features = ["auth", "client", "macros", "transport-child-process", "transport-io", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
async-trait = "=0.1.92"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
axum = { version = "=0.8.9", features = ["ws"] }
dingtalk-stream = "=0.1.7"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream", "multipart", "query", "form", "rustls"] }
# rustls 双 provider 时必须在进程启动时显式指定默认（reqwest 走 aws-lc-rs，quinn 拉 ring，
# 两边同时编译进 rustls 后它无法自动抉择，首次 TLS 建连即 panic）。这里只为拿到
# `rustls::crypto::ring::default_provider()`，特性保持最小可用。
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
genai = { git = "https://github.com/kawayiYokami/rust-genai.git", branch = "main" }
base64 = "=0.23.1"
zstd = "=0.14.4"
aes = "=0.9.4"
aes-gcm = "=0.11.1"
qrcode = "=0.15.0"
md5 = "=0.8.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
infer = "=0.22.0"
uuid = { version = "=1.29.3", features = ["v4"] }
once_cell = "=1.21.4"
scraper = "=0.29.0"
rs-trafilatura = "=0.2.2"
urlencoding = "=2.1.3"
webbrowser = "=1.2.7"
futures-util = "=0.3.34"
socket2 = "=0.6.5"
os_info = "=3.15.0"
sse-stream = "=0.2.6"
sha2 = "=0.11.1"
sha1 = "=0.11.0"
pdf_oxide = { version = "=0.3.78", default-features = false }
hayro = "=0.9.0"
aho-corasick = "=1.1.5"
enigo = "=0.6.1"
webp = "=0.3.1"
rayon = "=1.12.0"
tiktoken-rs = "=0.12.1"
xcap = "=0.9.10"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
parking_lot = "=0.13.0"
tantivy = "=0.27.0"
font-kit = "=0.14.3"
chrono = { version = "=0.4.45", features = ["serde"] }
undoc = "=0.28.0"
litchi = { git = "https://github.com/DevExzh/litchi.git", rev = "5a931961d58bf71c6bb5b7e82f450bda34349e3d" }
walkdir = "=2.5.1"
zip = { version = "=9.8.2", default-features = false, features = ["deflate", "aes-crypto"] }
ropey = "=1.6.1"
unicode-segmentation = "=1.13.3"
notify = "=9.0.0"
notify-debouncer-mini = "=0.8.0"
gix-ignore = "=0.25.0"
bstr = "=1.14.0"
trash = "=5.4.0"
agent-client-protocol = { version = "=5.5.1", features = ["stdio"] }
jsonc-parser = { version = "=0.34.0", features = ["serde", "serde_json"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = true

[profile.test.package."*"]
debug = 0

[profile.release]
opt-level = "z"
lto = false
codegen-units = 1
strip = true
# 行号表只进 pdb、不进 exe：exe 体积基本不变，崩溃偏移能解析到函数与源码行。
# 产物名是 p_ai.pdb（下划线，取自 crate 名），不是 p-ai.pdb。
# 发布时该文件必须归档（不进安装包），否则崩溃地址仍然只能解到函数、到不了行。
debug = "line-tables-only"
panic = "abort"

[dev-dependencies]
httpmock = "=0.9.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }
windows-core = "=0.62.2"
rdev = "=0.5.3"
# 与 tauri 2.12 内部使用的版本精确对齐（tauri-runtime-wry 2.12 依赖 webview2-com ^0.39）：
# ProcessFailed 回调类型必须与 PlatformWebview::controller 返回的是同一份 crate 实例。
webview2-com = "=0.39.1"

[target.'cfg(target_os = "linux")'.dependencies]
rdev = "=0.5.3"
users = "=0.11.0"
xcb = "=1.7.1"
atspi = { version = "=0.30.0", features = ["zbus", "tokio"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
core-graphics = "=0.25.0"
objc2-app-kit = "=0.3.2"
objc2-core-foundation = "=0.3.2"
users = "=0.11.0"
