[package]
name = "easy-call-ai"
version = "0.94.6"
edition = "2021"
description = "P-ai desktop app"
default-run = "p-ai"
autobins = false

[[bin]]
name = "p-ai"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chardetng = "1.0.0"
encoding_rs = "0.8"
toml = "1.1.2"
serde_yaml = "0.9"
directories = "6.0.0"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
time = { version = "0.3.53", features = ["local-offset"] }
rmcp = { version = "3.0.1", features = ["auth", "client", "macros", "transport-child-process", "transport-io", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
async-trait = "0.1"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
axum = { version = "0.8", features = ["ws"] }
dingtalk-stream = "0.1.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "multipart", "query", "form", "rustls"] }
genai = { git = "https://github.com/jeremychone/rust-genai.git", rev = "77894f75b2df01fcce522084096a9ec8beef9e58" }
base64 = "0.22"
zstd = "0.13"
aes = "0.9.1"
md5 = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
infer = "0.19.0"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
scraper = "0.27.0"
rs-trafilatura = "0.2"
urlencoding = "2.1"
webbrowser = "1.0"
futures-util = "0.3"
socket2 = "0.6.4"
os_info = "3"
sse-stream = "0.2"
sha2 = "0.11.0"
pdf_oxide = { version = "0.3.70", default-features = false }
hayro = "0.7.1"
aho-corasick = "1.1"
enigo = "0.6"
arboard = "3"
webp = "0.3"
rayon = "1.10"
tiktoken-rs = "0.12.0"
xcap = "0.9.6"
rusqlite = { version = "0.39.0", features = ["bundled"] }
parking_lot = "0.12"
tantivy = "0.26.0"
font-kit = "0.14"
chrono = { version = "0.4", features = ["serde"] }
undoc = "0.5.2"
litchi = { git = "https://github.com/DevExzh/litchi.git", rev = "5a931961d58bf71c6bb5b7e82f450bda34349e3d" }
walkdir = "2.5.0"
zip = { version = "8.5.1", default-features = false, features = ["deflate", "aes-crypto"] }
ropey = "1.6.1"
unicode-segmentation = "1.13.3"
notify = "7"
notify-debouncer-mini = "0.5"
gix-ignore = "0.22"
bstr = "1"
trash = "5.2.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = true

[profile.test.package."*"]
debug = 0

[profile.release]
opt-level = "z"
lto = false
codegen-units = 16
strip = true
debug = false

[dev-dependencies]
httpmock = "0.8.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }
windows-core = "0.61.2"
rdev = "0.5"
# 与 tauri 2.11.5 内部使用的版本精确对齐：ProcessFailed 回调类型必须与
# PlatformWebview::controller 返回的是同一份 crate 实例。
webview2-com = "=0.38.2"

[target.'cfg(target_os = "linux")'.dependencies]
rdev = "0.5"
users = "0.11"
xcb = "1.7"
atspi = { version = "0.30", features = ["zbus", "tokio"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
users = "0.11"
